name: Timeline Engine Tests

on:
  push:
    branches: [feature/unified-timeline-ir, main]
  pull_request:
    branches: [feature/unified-timeline-ir, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov

      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install pydantic
          pytest tests/test_core_ir.py tests/test_core_runtime.py \
            tests/test_timeline_ir.py tests/test_timeline_patch.py \
            tests/test_fusion.py tests/test_integration.py \
            tests/test_timeline_rules.py tests/test_timeline_safety.py \
            tests/test_abstract.py tests/test_old_adapter.py \
            tests/test_new_adapter.py tests/test_migration.py \
            tests/test_dual_write.py tests/test_migration_router.py \
            --cov=core --cov=timeline --cov-report=term-missing -v
