name: CI

on:
  push:
    branches: [feature/unified-timeline-ir, main]
  pull_request:
    branches: [feature/unified-timeline-ir, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic jsonschema
      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_core_ir.py tests/test_core_runtime.py \
            tests/test_timeline_ir.py tests/test_timeline_patch.py \
            tests/test_fusion.py tests/test_integration.py \
            tests/test_timeline_rules.py tests/test_timeline_safety.py \
            tests/test_abstract.py tests/test_old_adapter.py \
            tests/test_new_adapter.py tests/test_migration.py \
            tests/test_dual_write.py tests/test_migration_router.py \
            --cov=core --cov=timeline --cov-report=term-missing -v
      - name: Validate JSON Schemas
        run: python tests/validate_schemas.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: GUI
        run: npm ci
      - name: TypeScript check
        working-directory: GUI
        run: npx tsc -p tsconfig.json --noEmit
      - name: Run tests
        working-directory: GUI
        run: npx vitest run
