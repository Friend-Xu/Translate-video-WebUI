name: CI

on:
  push:
    branches: [feature/workflow-mvp, main]
  pull_request:
    branches: [feature/workflow-mvp, main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic jsonschema numpy PyYAML
      - name: Run core tests (excl TTS integration)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            --ignore=tests/test_tts \
            -q --tb=short \
            --strict-markers \
            --cov=core --cov-report=term-missing

  tts-tests:
    needs: core-tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic jsonschema numpy PyYAML
      - name: Run TTS tests (allow xfail for infrastructure-dependent)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_tts/ \
            -q --tb=short \
            --strict-markers

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: GUI
        run: npm ci
      - name: TypeScript check
        working-directory: GUI
        run: npx tsc -p tsconfig.json --noEmit
      - name: Run tests
        working-directory: GUI
        run: npx vitest run
