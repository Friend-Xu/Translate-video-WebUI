name: CI

on:
  push:
    branches: [feature/workflow-mvp, feature/unified-timeline-ir, main]
  pull_request:
    branches: [feature/workflow-mvp, feature/unified-timeline-ir, main]

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic jsonschema numpy PyYAML
      - name: Run core/ unit tests (L1)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_core_ir.py tests/test_core_runtime.py \
            tests/test_timeline_ir.py tests/test_timeline_patch.py \
            tests/test_timeline_rules.py tests/test_timeline_safety.py \
            tests/test_abstract.py tests/test_old_adapter.py \
            tests/test_new_adapter.py tests/test_migration.py \
            tests/test_dual_write.py tests/test_migration_router.py \
            tests/test_ch12_patch_system.py tests/test_ch14_translation_quality.py \
            tests/test_srt_gate_consistency.py \
            tests/test_config_resolver.py tests/test_passes.py \
            --cov=core --cov=SRT --cov-report=term-missing -v

  regression:
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pydantic jsonschema numpy PyYAML
      - name: Run migration + adapter regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/test_migration.py tests/test_dual_write.py \
            tests/test_asr_adapters.py tests/test_tts_adapters.py \
            tests/test_cosyvoice_adapters.py tests/test_edge_tts_adapters.py \
            tests/test_indextts_adapters.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: GUI
        run: npm ci
      - name: TypeScript check
        working-directory: GUI
        run: npx tsc -p tsconfig.json --noEmit
      - name: Run tests
        working-directory: GUI
        run: npx vitest run
