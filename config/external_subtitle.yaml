# 外挂字幕优化配置
external_subtitle:
  # 输出模式: target_only (仅译文) | source_only (仅原文) | bilingual (双语合并)
  mode: bilingual

  # ── 阅读参数（按书写系统） ──
  # CJK（中日韩）: 4 字/秒 ≈ 250 字/分钟
  min_duration_cjk: 1.5
  reading_speed_cjk: 4.0

  # 拉丁/西里尔（英法德西俄等）: 12 字符/秒
  min_duration_latin: 1.2
  reading_speed_latin: 12.0

  # 阿拉伯: 10 字符/秒
  min_duration_arabic: 1.3
  reading_speed_arabic: 10.0

  # ── 合并策略 ──
  max_merge_gap: 0.3      # 相邻字幕间隙 ≤ 此值允许合并（秒）
  inter_gap: 0.05          # 字幕间呼吸间隔（秒）
  max_duration: 10.0       # 单条字幕最大显示时长（秒）
