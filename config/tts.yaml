tts:
  engine_type: edge
  voice: zh-CN-XiaoxiaoNeural
  base_speed: 30
  max_speed: 100
  search_method: binary
  speed_tolerance: 0.15
  enable_emotion: false
  emotion_engine: ''
  emotion_ref_audio: null
  default_emotion: neutral
  threading_workers: 7
  enable_openvoice: false
  voice_clone_sample: null
  openvoice_model_version: v2
  # 新版音色克隆引擎配置
  voice_clone_engine: none  # openvoice | cosyvoice | none (需提供参考音频)
  voice_clone_device: auto  # auto | cuda:0 | cpu
  voice_clone_concurrency: 1  # 并发数（需足够显存）
  voice_clone_vram_limit_mb: 0  # 0=auto
  enable_caption: true
  caption_font: ./models/font/Minecraft_font/5_Minecraft_AE_zh_en.ttf
  enable_resume: true
  resume_file: file/wav_path.txt
  output_dir: file/EdgeTTS_Audio_file
  video_output_dir: file/Video_file
  audio_codec: pcm_s32le
  audio_bitrate: 192k
  video_codec: libx264
  video_audio_codec: aac
  video_bitrate: 10M
  write_logger: null
  # Set to your ImageMagick magick.exe path. Common locations:
  #   Windows: C:\Program Files\ImageMagick-<version>\magick.exe
  #   Linux/macOS: auto-detected from PATH (just "magick")
  imagemagick_binary: magick
  openvoice_v1_dir: ./models/openvoice_v1
  openvoice_v2_dir: ./models/openvoice_v2
