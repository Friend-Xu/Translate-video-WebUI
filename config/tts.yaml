tts:
  engine_type: edge
  # ChatTTS 本地 TTS 配置
  chattts_speaker_seed: 2      # 固定音色种子（null=随机）
  chattts_model_source: local   # local | custom
  chattts_model_path: null      # custom 模式下的本地模型路径
  # ChatTTS 发音术语表（优先于自动数字转换，key → 替换后文本）
  tts_pronunciation:
    "RTX": "RTX"
    "3060": "三零六零"
  # ── CosyVoice TTS 配置 ─────────────────────────────
  cosyvoice_tts_model_version: v2          # v2 (推荐) | v3 (实验性，cross_lingual 有 bug)
  cosyvoice_tts_model_path: ""             # 留空自动选择 models/CosyVoice2-0.5B 或 CosyVoice3-0.5B
  cosyvoice_tts_prompt_audio: ""           # 参考音频路径（留空从视频人声自动提取）
  cosyvoice_tts_prompt_text: ""            # 参考音频的文字转录（zero_shot 需匹配音频内容）
  cosyvoice_tts_fp16: true                 # FP16 推理降低显存
  cosyvoice_tts_workers: 0                 # 0=自动（当前强制 1 串行安全）
  cosyvoice_tts_speed: 1.0                 # 默认语速 (0.5~2.0, 1.0=原速)
  cosyvoice_tts_mode: cross_lingual         # 统一使用 cross_lingual（预规范化 + text_frontend=False，已验证最优）
  cosyvoice_tts_lang: ""                   # cross_lingual 目标语言 (zh/en/ja/ko/yue, 留空=自动)
  # ── EdgeTTS 配置 ───────────────────────────────────
  voice: zh-CN-XiaoxiaoNeural
  base_speed: 40
  max_speed: 100
  search_method: binary
  speed_tolerance: 0.15
  enable_emotion: false
  emotion_engine: ''
  emotion_ref_audio: null
  default_emotion: neutral
  threading_workers: 7
  enable_openvoice: false
  voice_clone_sample: null
  openvoice_model_version: v2
  # 新版音色克隆引擎配置
  voice_clone_engine: none  # openvoice | cosyvoice | none (需提供参考音频)
  voice_clone_device: auto  # auto | cuda:0 | cpu
  voice_clone_concurrency: 1  # 并发数（需足够显存）
  voice_clone_vram_limit_mb: 0  # 0=auto
  enable_caption: true
  caption_font: ./models/font/Minecraft_font/5_Minecraft_AE_zh_en.ttf
  enable_resume: true
  resume_file: file/wav_path.txt
  output_dir: file/EdgeTTS_Audio_file
  video_output_dir: file/Video_file
  audio_codec: pcm_s32le
  audio_bitrate: 192k
  video_codec: libx264
  video_audio_codec: aac
  video_bitrate: 10M
  write_logger: null
  # Set to your ImageMagick magick.exe path. Common locations:
  #   Windows: C:\Program Files\ImageMagick-<version>\magick.exe
  #   Linux/macOS: auto-detected from PATH (just "magick")
  imagemagick_binary: magick
  openvoice_v1_dir: ./models/openvoice_v1
  openvoice_v2_dir: ./models/openvoice_v2
